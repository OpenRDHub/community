name: Community CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Community checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHON: python3
    steps:
      - name: Check out the proposed changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/requirements.txt

      - name: Install locked dependencies
        run: |
          npm ci --prefix web --ignore-scripts
          python3 -m pip install --disable-pip-version-check -r web/requirements.txt

      - name: Check source syntax and patch whitespace
        run: |
          for source in web/*.js web/*.mjs; do
            node --check "$source"
          done
          git diff --check HEAD^ HEAD

      - name: Validate record metadata and public visibility
        run: python3 web/check-public-records.py

      - name: Test ingestion, translations and local links
        run: npm --prefix web test

      - name: Build the actual repository preview
        env:
          SITE_OUTPUT: ${{ runner.temp }}/community-site
        run: npm --prefix web run build

      - name: Ensure checks do not rewrite tracked sources
        run: git diff --exit-code
